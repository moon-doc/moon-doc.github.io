name: probe app token
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: t
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: moon-reader
      - name: 探针：token 能力
        env:
          GH_TOKEN: ${{ steps.t.outputs.token }}
        run: |
          echo "token 长度: ${#GH_TOKEN}"
          curl -s -o /tmp/r.json -w "installation/repositories HTTP %{http_code}\n" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/installation/repositories
          python3 -c "import json;d=json.load(open('/tmp/r.json'));print('可访问仓库:',[x['full_name'] for x in d.get('repositories',[])],'total:',d.get('total_count'))" || cat /tmp/r.json
          git ls-remote "https://x-access-token:$GH_TOKEN@github.com/moon-doc/moon-reader" HEAD && echo "★ ls-remote 成功"
      - name: 探针：nested checkout（先 checkout 本仓，再 checkout moon-reader）
        uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: moon-doc/moon-reader
          token: ${{ steps.t.outputs.token }}
          ref: main
          path: moon-reader
      - name: 探针：脚本存在？
        run: ls -la moon-reader/scripts/gen_shuge_index.py
