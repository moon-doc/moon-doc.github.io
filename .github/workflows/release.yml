name: Build Release Apps
run-name: Build Release Apps ${{ github.event.client_payload.tag || github.event.inputs.tag }}

on:
  repository_dispatch:
    types: [build-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.2.0)"
        required: true

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: moon-reader

      - name: Checkout moon-reader (private)
        uses: actions/checkout@v4
        with:
          repository: moon-doc/moon-reader
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.client_payload.tag || github.event.inputs.tag }}

      - name: Override Cargo config for CI (remove USTC mirror)
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin"
          printf '[target.aarch64-linux-android]\nlinker = "%s/aarch64-linux-android35-clang"\n' "$NDK_BIN" > src-tauri/.cargo/config.toml
          cat src-tauri/.cargo/config.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "build-tools;35.0.0" "platforms;android-35" "ndk;27.1.12297006"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Restore Android keystore
        env:
          MDOC_ANDROID_KEYSTORE_BASE64: ${{ secrets.MDOC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MDOC_ANDROID_KEYSTORE_BASE64" ]; then
            echo "$MDOC_ANDROID_KEYSTORE_BASE64" | base64 --decode > android-release.keystore
          fi

      - name: Initialize Android project
        run: npx tauri android init --ci --skip-targets-install

      - name: Build Android (APK + AAB, single Rust compile)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          JAVA_HOME: ${{ env.JAVA_HOME }}
          MDOC_STORE_PASSWORD: ${{ secrets.MDOC_STORE_PASSWORD }}
          MDOC_KEY_PASSWORD: ${{ secrets.MDOC_KEY_PASSWORD }}
        run: |
          npm run build:web
          source android-env.sh
          npx tauri android build --target aarch64

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdoc-android
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: moon-reader

      - name: Checkout moon-reader (private)
        uses: actions/checkout@v4
        with:
          repository: moon-doc/moon-reader
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.client_payload.tag || github.event.inputs.tag }}

      - name: Override Cargo config for CI (remove USTC mirror)
        run: |
          rm -f src-tauri/.cargo/config.toml
          touch src-tauri/.cargo/config.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Initialize iOS project
        run: npx tauri ios init --ci --skip-targets-install

      - name: Build unsigned iOS archive
        run: npm run build:web && npx tauri ios build --ci --no-sign --archive-only

      - name: Package iOS artifacts
        run: |
          mkdir -p release
          find src-tauri/gen/apple/build -name "*.xcarchive" -print0 | while IFS= read -r -d '' archive; do
            ditto -c -k --sequesterRsrc --keepParent "$archive" "release/$(basename "$archive").zip"
          done
          find src-tauri/gen/apple/build -name "*.ipa" -exec cp {} release/ \;

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdoc-ios
          if-no-files-found: error
          path: release/*

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: moon-reader

      - name: Checkout moon-reader (private)
        uses: actions/checkout@v4
        with:
          repository: moon-doc/moon-reader
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.client_payload.tag || github.event.inputs.tag }}

      - name: Override Cargo config for CI (remove USTC mirror)
        run: |
          rm -f src-tauri/.cargo/config.toml
          touch src-tauri/.cargo/config.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build macOS app
        run: npm run build:web && npx tauri build --ci --target universal-apple-darwin --bundles app,dmg --no-sign

      - name: Package macOS artifacts
        run: |
          mkdir -p release
          find src-tauri/target/universal-apple-darwin/release/bundle -name "*.app" -print0 | while IFS= read -r -d '' app; do
            ditto -c -k --sequesterRsrc --keepParent "$app" "release/$(basename "$app").zip"
          done
          find src-tauri/target/universal-apple-darwin/release/bundle -name "*.dmg" -exec cp {} release/ \;

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdoc-macos
          if-no-files-found: error
          path: release/*

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: moon-reader

      - name: Checkout moon-reader (private)
        uses: actions/checkout@v4
        with:
          repository: moon-doc/moon-reader
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.client_payload.tag || github.event.inputs.tag }}

      - name: Override Cargo config for CI (remove USTC mirror)
        shell: bash
        run: |
          rm -f src-tauri/.cargo/config.toml
          touch src-tauri/.cargo/config.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install npm dependencies
        shell: bash
        run: |
          npm ci
          npm ci --prefix web

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Windows app
        run: npm run build:web && npx tauri build --ci --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdoc-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/**/*.exe

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: moon-reader

      - name: Checkout moon-reader (private)
        uses: actions/checkout@v4
        with:
          repository: moon-doc/moon-reader
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.client_payload.tag || github.event.inputs.tag }}

      - name: Override Cargo config for CI (remove USTC mirror)
        run: |
          rm -f src-tauri/.cargo/config.toml
          touch src-tauri/.cargo/config.toml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Linux app (deb + rpm + AppImage)
        run: npm run build:web && npx tauri build --ci --bundles deb,rpm,appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdoc-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/**/*.deb
            src-tauri/target/release/bundle/rpm/**/*.rpm
            src-tauri/target/release/bundle/appimage/**/*.AppImage

  release:
    name: Publish GitHub Release
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    needs:
      - android
      - ios
      - macos
      - windows
      - linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: moon-reader,moon-doc.github.io

      - name: Publish release assets & update Pages
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PAGES_REPO: moon-doc/moon-doc.github.io
          PAGES_BASE: https://moon.jdk.plus
          PRIVATE_REPO: moon-doc/moon-reader
        run: |
          set -e
          TAG="${{ github.event.client_payload.tag || github.event.inputs.tag }}"
          VERSION="${TAG#v}"

          # 1) 重命名安装包（ASCII 文件名，避免 locale/gh CLI 截断）
          mkdir -p staging
          find release-artifacts -type f -print0 | while IFS= read -r -d '' f; do
            case "$f" in
              *.aab|*.xcarchive.zip|*.app.zip) continue ;;
            esac
            base=$(basename "$f")
            case "$base" in
              *.dmg)       cp "$f" "staging/MoonReader-${VERSION}-macos-universal.dmg" ;;
              *.exe)       cp "$f" "staging/MoonReader-${VERSION}-windows-x64-setup.exe" ;;
              *.apk)       cp "$f" "staging/MoonReader-${VERSION}-android-arm64.apk" ;;
              *.deb)       cp "$f" "staging/MoonReader-${VERSION}-linux-amd64.deb" ;;
              *.rpm)       cp "$f" "staging/MoonReader-${VERSION}-linux-x86_64.rpm" ;;
              *.AppImage)  cp "$f" "staging/MoonReader-${VERSION}-linux-x86_64.AppImage" ;;
              *)           cp "$f" "staging/$base" ;;
            esac
          done

          echo "=== Staged files ==="
          ls -lh staging/

          # 2) 在公开仓库创建 tag + Release（安装包托管在 Release，绕过 Git 100MB 限制）
          #    先手动创建 tag（gh release create 自动创建 tag 会被组织规则拦截）
          PAGES_SHA=$(gh api "repos/${PAGES_REPO}/commits/main" -q '.sha')
          if ! gh api "repos/${PAGES_REPO}/git/refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Creating tag ${TAG} on ${PAGES_REPO}..."
            gh api "repos/${PAGES_REPO}/git/refs" \
              -f "ref=refs/tags/${TAG}" -f "sha=${PAGES_SHA}"
          fi

          # 3) 创建 draft Release → 上传 → 发布
          if gh release view "$TAG" -R "$PAGES_REPO" > /dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" -R "$PAGES_REPO" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Release exists (draft), uploading assets..."
              gh release upload "$TAG" -R "$PAGES_REPO" --clobber staging/*
            else
              echo "Release already published, skipping upload"
            fi
          else
            echo "Creating draft release..."
            gh release create "$TAG" -R "$PAGES_REPO" --draft \
              --title "v${VERSION}" --notes "小月亮阅读器 v${VERSION} - 跨平台专业文档阅读器"
            gh release upload "$TAG" -R "$PAGES_REPO" --clobber staging/*
            gh release edit "$TAG" -R "$PAGES_REPO" --draft=false
          fi

          # 4) 同时上传到 moon-reader 私有仓库（保留完整发布记录）
          if gh release view "$TAG" -R "$PRIVATE_REPO" > /dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" -R "$PRIVATE_REPO" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Release exists (draft), uploading assets..."
              gh release upload "$TAG" -R "$PRIVATE_REPO" --clobber staging/*
            else
              echo "Release already published, skipping upload"
            fi
          else
            gh release create "$TAG" -R "$PRIVATE_REPO" \
              --title "v${VERSION}" --notes "小月亮阅读器 v${VERSION} - 跨平台专业文档阅读器" \
              staging/*
          fi

          # 5) 生成下载直链（指向公开仓库 Release）
          RELEASED_AT=$(gh release view "$TAG" -R "$PAGES_REPO" --json publishedAt -q '.publishedAt // ""')
          NOTES="小月亮阅读器 v${VERSION} - 跨平台专业文档阅读器"
          RELEASE_BASE="https://github.com/${PAGES_REPO}/releases/download/${TAG}"
          encode() { python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$1"; }

          MAC=""; WIN=""; AND=""; LIN_DEB=""; LIN_RPM=""; LIN_APP=""; LIN=""
          for f in staging/*; do
            [ -z "$f" ] && continue
            case "$f" in
              *.dmg)      MAC="${RELEASE_BASE}/$(encode "$(basename "$f")")" ;;
              *.exe)      WIN="${RELEASE_BASE}/$(encode "$(basename "$f")")" ;;
              *.apk)      AND="${RELEASE_BASE}/$(encode "$(basename "$f")")" ;;
              *.deb)      LIN_DEB="${RELEASE_BASE}/$(encode "$(basename "$f")")" ;;
              *.rpm)      LIN_RPM="${RELEASE_BASE}/$(encode "$(basename "$f")")" ;;
              *.AppImage) LIN_APP="${RELEASE_BASE}/$(encode "$(basename "$f")")" ;;
            esac
          done

          LIN="${LIN_DEB:-${LIN_RPM:-${LIN_APP:-}}}"
          FALLBACK_URL="${PAGES_BASE}#start"
          [ -n "$MAC" ]     || MAC="$FALLBACK_URL"
          [ -n "$WIN" ]     || WIN="$FALLBACK_URL"
          [ -n "$AND" ]     || AND="$FALLBACK_URL"
          [ -n "$LIN_DEB" ] || LIN_DEB="$FALLBACK_URL"
          [ -n "$LIN_RPM" ] || LIN_RPM="$FALLBACK_URL"
          [ -n "$LIN_APP" ] || LIN_APP="$FALLBACK_URL"
          [ -n "$LIN" ]     || LIN="$FALLBACK_URL"

          # 6) 计算最低支持版本
          MIN_PATCH=$(( $(echo "$VERSION" | cut -d. -f3) - 20 ))
          [ "$MIN_PATCH" -lt 0 ] && MIN_PATCH=0
          MIN_REQUIRED="$(echo "$VERSION" | cut -d. -f1-2).${MIN_PATCH}"

          # 7) 组装 version.json
          jq -n --arg v "$VERSION" --arg n "$NOTES" --arg t "$RELEASED_AT" \
                --arg mac "$MAC" --arg win "$WIN" --arg and "$AND" --arg lin "$LIN" \
                --arg lin_deb "$LIN_DEB" --arg lin_rpm "$LIN_RPM" --arg lin_app "$LIN_APP" \
                --arg mr "$MIN_REQUIRED" \
            '{version:$v, releasedAt:$t, notes:$n,
              downloadUrl:"https://moon.jdk.plus#start", minimumRequired:$mr,
              downloads:{macos:$mac, windows:$win, android:$and, linux:$lin, ios:""},
              linuxDownloads:{deb:$lin_deb, rpm:$lin_rpm, appimage:$lin_app}}' \
            > version.json
          echo "Generated version.json:"
          cat version.json

          # 8) 推送 version.json + 更新 index.html 到 Pages 仓库
          export VERSION MAC WIN AND LIN_DEB LIN_RPM PAGES_BASE
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${PAGES_REPO}.git" pages
          cp version.json pages/version.json

          # 9) 替换 index.html 中的下载按钮 href 和版本标签
          if [ -f pages/index.html ]; then
            python3 - <<'PYEOF2'
          import re, os
          v = os.environ["VERSION"]
          mac = os.environ["MAC"]
          win = os.environ["WIN"]
          android_url = os.environ["AND"]
          lin_deb_url = os.environ["LIN_DEB"]
          lin_rpm_url = os.environ["LIN_RPM"]
          pages_base = os.environ["PAGES_BASE"]
          with open("pages/index.html", "r", encoding="utf-8") as f:
              html = f.read()
          fallback = pages_base + "#start"
          urls = [mac or fallback, win or fallback, android_url or fallback,
                  lin_deb_url or fallback, lin_rpm_url or fallback, fallback]
          btn_pattern = re.compile(r'(<a\s+class="download-btn"\s+href=")([^"]*)(")')
          counter = [0]
          def replacer(m):
              idx = counter[0]
              new_url = urls[idx] if idx < len(urls) else m.group(2)
              counter[0] += 1
              return m.group(1) + new_url + m.group(3)
          html = btn_pattern.sub(replacer, html)
          smalls = list(re.finditer(r'<small>([^<]*)</small>', html))
          labels = [f"v{v} · DMG", f"v{v} · EXE", f"v{v} · APK", f"v{v} · DEB", f"v{v} · RPM", "即将上线"]
          for i, s in enumerate(smalls[:6]):
              if i < len(labels):
                  html = html.replace(s.group(0), f"<small>{labels[i]}</small>", 1)
          with open("pages/index.html", "w", encoding="utf-8") as f:
              f.write(html)
          print(f"Updated index.html download buttons to v{v}")
          PYEOF2
          fi

          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish v${VERSION} version.json + update download buttons" || {
            echo "::notice::No changes to commit"
            exit 0
          }
          git push

      - name: Prune old workflow runs (keep latest 10)
        if: always()
        run: |
          # --- Prune old workflow runs (keep latest 10) ---
          KEEP=10
          echo "Pruning workflow runs, keeping latest ${KEEP}..."
          RUNS=$(gh run list -R moon-doc/moon-doc.github.io --workflow release.yml --limit 100 --json databaseId --jq '
            . as $all
            | ($all | length) as $total
            | if $total <= '"$KEEP"' then empty
              else $all[:($total - '"$KEEP"')][] | .databaseId
            end
          ')
          if [ -z "$RUNS" ]; then
            echo "No runs to prune (≤ ${KEEP} total runs)"
          else
            COUNT=$(echo "$RUNS" | wc -l | tr -d ' ')
            echo "Deleting ${COUNT} old runs..."
            for run_id in $RUNS; do
              gh run delete "$run_id" -R moon-doc/moon-doc.github.io || true
            done
            echo "✓ Pruned ${COUNT} old runs, kept latest ${KEEP}"
          fi

          # --- Prune old caches (keep total under 8 GiB) ---
          CACHE_LIMIT=$((8 * 1024))  # MiB
          echo "Pruning caches, keeping total under 8 GiB..."
          CACHES=$(gh cache list -R moon-doc/moon-doc.github.io --limit 100 --json id,sizeInBytes,createdAt --jq 'sort_by(.createdAt)')
          if [ "$CACHES" = "[]" ] || [ -z "$CACHES" ]; then
            echo "No caches to prune"
          else
            TOTAL=0
            DELETE_IDS=""
            while IFS= read -r line; do
              ID=$(echo "$line" | cut -f1)
              SIZE_MIB=$(( $(echo "$line" | cut -f2) / 1024 / 1024 ))
              TOTAL=$((TOTAL + SIZE_MIB))
              if [ $TOTAL -gt $CACHE_LIMIT ]; then
                DELETE_IDS="$DELETE_IDS $ID"
              fi
            done < <(echo "$CACHES" | jq -r '.[] | "\(.id)\t\(.sizeInBytes)"')
            if [ -z "$DELETE_IDS" ]; then
              echo "Total cache ≈ $((TOTAL / 1024)) GiB, within limit"
            else
              COUNT=$(echo "$DELETE_IDS" | wc -w | tr -d ' ')
              echo "Deleting ${COUNT} old caches (total would exceed 8 GiB)..."
              for id in $DELETE_IDS; do
                echo -n "  Deleting $id... "
                gh cache delete "$id" -R moon-doc/moon-doc.github.io && echo "✓" || true
              done
            fi
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
