name: Build Release Apps

on:
  repository_dispatch:
    types: [build-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: moon-reader

      - name: Checkout moon-reader (private)
        uses: actions/checkout@v4
        with:
          repository: moon-doc/moon-reader
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.client_payload.tag || github.event.inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "build-tools;35.0.0" "platforms;android-35" "ndk;27.1.12297006"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Restore Android keystore
        env:
          MDOC_ANDROID_KEYSTORE_BASE64: ${{ secrets.MDOC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MDOC_ANDROID_KEYSTORE_BASE64" ]; then
            echo "$MDOC_ANDROID_KEYSTORE_BASE64" | base64 --decode > android-release.keystore
          fi

      - name: Initialize Android project
        run: npx tauri android init --ci --skip-targets-install

      - name: Build Android APK and AAB
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          JAVA_HOME: ${{ env.JAVA_HOME }}
          MDOC_STORE_PASSWORD: ${{ secrets.MDOC_STORE_PASSWORD }}
          MDOC_KEY_PASSWORD: ${{ secrets.MDOC_KEY_PASSWORD }}
        run: |
          npm run android:build:apk
          npm run android:build

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdoc-android
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: moon-reader

      - name: Checkout moon-reader (private)
        uses: actions/checkout@v4
        with:
          repository: moon-doc/moon-reader
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.client_payload.tag || github.event.inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Initialize iOS project
        run: npx tauri ios init --ci --skip-targets-install

      - name: Build unsigned iOS archive
        run: npm run build:web && npx tauri ios build --ci --no-sign --archive-only

      - name: Package iOS artifacts
        run: |
          mkdir -p release
          find src-tauri/gen/apple/build -name "*.xcarchive" -print0 | while IFS= read -r -d '' archive; do
            ditto -c -k --sequesterRsrc --keepParent "$archive" "release/$(basename "$archive").zip"
          done
          find src-tauri/gen/apple/build -name "*.ipa" -exec cp {} release/ \;

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdoc-ios
          if-no-files-found: error
          path: release/*

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: moon-reader

      - name: Checkout moon-reader (private)
        uses: actions/checkout@v4
        with:
          repository: moon-doc/moon-reader
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.client_payload.tag || github.event.inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build macOS app
        run: npm run build:web && npx tauri build --ci --target universal-apple-darwin --bundles app,dmg --no-sign

      - name: Package macOS artifacts
        run: |
          mkdir -p release
          find src-tauri/target/universal-apple-darwin/release/bundle -name "*.app" -print0 | while IFS= read -r -d '' app; do
            ditto -c -k --sequesterRsrc --keepParent "$app" "release/$(basename "$app").zip"
          done
          find src-tauri/target/universal-apple-darwin/release/bundle -name "*.dmg" -exec cp {} release/ \;

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdoc-macos
          if-no-files-found: error
          path: release/*

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: moon-reader

      - name: Checkout moon-reader (private)
        uses: actions/checkout@v4
        with:
          repository: moon-doc/moon-reader
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.client_payload.tag || github.event.inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install npm dependencies
        shell: bash
        run: |
          npm ci
          npm ci --prefix web

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Windows app
        run: npm run build:web && npx tauri build --ci --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdoc-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/**/*.exe

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: moon-reader

      - name: Checkout moon-reader (private)
        uses: actions/checkout@v4
        with:
          repository: moon-doc/moon-reader
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.client_payload.tag || github.event.inputs.tag }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Linux app (deb + rpm + AppImage)
        run: npm run build:web && npx tauri build --ci --bundles deb,rpm,appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdoc-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/**/*.deb
            src-tauri/target/release/bundle/rpm/**/*.rpm
            src-tauri/target/release/bundle/appimage/**/*.AppImage

  release:
    name: Publish GitHub Release
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    needs:
      - android
      - ios
      - macos
      - windows
      - linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: moon-reader,moon-doc.github.io

      - name: Publish release assets to moon-reader
        uses: softprops/action-gh-release@v2
        with:
          repository: moon-doc/moon-reader
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ github.event.client_payload.tag || github.event.inputs.tag }}
          files: release-artifacts/**/*
          generate_release_notes: true

      - name: Publish version.json & installers to Pages site
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PAGES_REPO: moon-doc/moon-doc.github.io
          PAGES_BASE: https://moon.jdk.plus
          PRIVATE_REPO: moon-doc/moon-reader
        run: |
          set -e
          TAG="${{ github.event.client_payload.tag || github.event.inputs.tag }}"
          VERSION="${TAG#v}"

          # 1) 读取 Release notes 与发布时间
          NOTES=$(gh release view "$TAG" -R "$PRIVATE_REPO" --json body -q '.body'             | sed 's/[`#*]//g' | tr -s ' \n' ' ' | cut -c1-500)
          RELEASED_AT=$(gh release view "$TAG" -R "$PRIVATE_REPO" --json publishedAt -q '.publishedAt // ""')

          # 2) 重命名安装包为友好名
          mkdir -p staging
          find release-artifacts -type f | while read -r f; do
            case "$f" in
              *.aab|*.xcarchive.zip) continue ;;
            esac
            base=$(basename "$f")
            case "$base" in
              *.dmg)       cp "$f" "staging/小月亮阅读器_${VERSION}_macos_universal.dmg" ;;
              *.exe)       cp "$f" "staging/小月亮阅读器_${VERSION}_windows_x64-setup.exe" ;;
              *.apk)       cp "$f" "staging/小月亮阅读器_${VERSION}_android_universal.apk" ;;
              *.deb)       cp "$f" "staging/小月亮阅读器_${VERSION}_linux_amd64.deb" ;;
              *.rpm)       cp "$f" "staging/小月亮阅读器_${VERSION}_linux_x86_64.rpm" ;;
              *.AppImage)  cp "$f" "staging/小月亮阅读器_${VERSION}_linux_x86_64.AppImage" ;;
              *)           cp "$f" "staging/$base" ;;
            esac
          done

          # 3) Clone Pages 仓库，复制安装包到 downloads/<VERSION>/
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${PAGES_REPO}.git" pages
          mkdir -p "pages/downloads/${VERSION}"
          cp staging/* "pages/downloads/${VERSION}/"

          # 4) 生成下载直链（Pages 站点托管）
          FALLBACK_URL="${PAGES_BASE}#start"
          DL_BASE="${PAGES_BASE}/downloads/${VERSION}"
          encode() { python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$1"; }

          MAC=""; WIN=""; AND=""; LIN_DEB=""; LIN_RPM=""; LIN_APP=""; LIN=""
          for f in staging/*; do
            [ -z "$f" ] && continue
            case "$f" in
              *.dmg)      MAC="${DL_BASE}/$(encode "$(basename "$f")")" ;;
              *.exe)      WIN="${DL_BASE}/$(encode "$(basename "$f")")" ;;
              *.apk)      AND="${DL_BASE}/$(encode "$(basename "$f")")" ;;
              *.deb)      LIN_DEB="${DL_BASE}/$(encode "$(basename "$f")")" ;;
              *.rpm)      LIN_RPM="${DL_BASE}/$(encode "$(basename "$f")")" ;;
              *.AppImage) LIN_APP="${DL_BASE}/$(encode "$(basename "$f")")" ;;
            esac
          done

          LIN="${LIN_DEB:-${LIN_RPM:-${LIN_APP:-}}}"
          [ -n "$MAC" ]     || MAC="$FALLBACK_URL"
          [ -n "$WIN" ]     || WIN="$FALLBACK_URL"
          [ -n "$AND" ]     || AND="$FALLBACK_URL"
          [ -n "$LIN_DEB" ] || LIN_DEB="$FALLBACK_URL"
          [ -n "$LIN_RPM" ] || LIN_RPM="$FALLBACK_URL"
          [ -n "$LIN_APP" ] || LIN_APP="$FALLBACK_URL"
          [ -n "$LIN" ]     || LIN="$FALLBACK_URL"

          # 5) 计算最低支持版本（本次版本往前 10 个小版本，不低于 1.0.0）
          MIN_PATCH=$(( $(echo "$VERSION" | cut -d. -f3) - 10 ))
          [ "$MIN_PATCH" -lt 0 ] && MIN_PATCH=0
          MIN_REQUIRED="$(echo "$VERSION" | cut -d. -f1-2).${MIN_PATCH}"

          # 6) 组装 version.json
          jq -n --arg v "$VERSION" --arg n "$NOTES" --arg t "$RELEASED_AT" \
                --arg mac "$MAC" --arg win "$WIN" --arg and "$AND" --arg lin "$LIN" \
                --arg lin_deb "$LIN_DEB" --arg lin_rpm "$LIN_RPM" --arg lin_app "$LIN_APP" \
                --arg mr "$MIN_REQUIRED" \
            '{version:$v, releasedAt:$t, notes:$n,
              downloadUrl:"https://moon.jdk.plus#start", minimumRequired:$mr,
              downloads:{macos:$mac, windows:$win, android:$and, linux:$lin, ios:""},
              linuxDownloads:{deb:$lin_deb, rpm:$lin_rpm, appimage:$lin_app}}' \
            > pages/version.json
          echo "Generated version.json:"
          cat pages/version.json

          # 7) 替换 index.html 中的下载按钮 href 和版本标签
          if [ -f pages/index.html ]; then
            python3 - <<PYEOF2
          import re
          v = "${VERSION}"
          mac = "${MAC}"
          win = "${WIN}"
          android_url = "${AND}"
          lin_deb_url = "${LIN_DEB}"
          lin_rpm_url = "${LIN_RPM}"
          pages_base = "${PAGES_BASE}"
          with open("pages/index.html", "r", encoding="utf-8") as f:
              html = f.read()
          html = re.sub(r"^(https?://[^\s<]+)+", "", html)
          fallback = pages_base + "#start"
          urls = [mac or fallback, win or fallback, android_url or fallback,
                  lin_deb_url or fallback, lin_rpm_url or fallback, fallback]
          btn_pattern = re.compile(r'(<a\s+class="download-btn"\s+href=")([^"]*)(")')
          counter = [0]
          def replacer(m):
              idx = counter[0]
              new_url = urls[idx] if idx < len(urls) else m.group(2)
              counter[0] += 1
              return m.group(1) + new_url + m.group(3)
          html = btn_pattern.sub(replacer, html)
          smalls = list(re.finditer(r'<small>([^<]*)</small>', html))
          labels = [f"v{v} · DMG", f"v{v} · EXE", f"v{v} · APK", f"v{v} · DEB", f"v{v} · RPM", "即将上线"]
          for i, s in enumerate(smalls[:6]):
              if i < len(labels):
                  html = html.replace(s.group(0), f"<small>{{labels[i]}}</small>", 1)
          with open("pages/index.html", "w", encoding="utf-8") as f:
              f.write(html)
          print(f"Updated index.html download buttons to v{v}")
          PYEOF2
          fi

          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish v${VERSION} installers + version.json" || {
            echo "::notice::No changes to commit"
            exit 0
          }
          git push
